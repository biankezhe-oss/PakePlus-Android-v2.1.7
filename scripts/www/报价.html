<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>科振不锈钢执行器报价</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Microsoft Yahei", "PingFang SC", sans-serif;
    }
    body {
      min-height: 100vh;
      padding: 10px 8px;
      background: #f3f1fa;
    }
    .container {
      max-width: 100%;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(102, 51, 171, 0.12);
      padding: 14px 12px;
      border: 1px solid #e3d9f5;
    }
    .header-title {
      text-align: center;
      margin-bottom: 14px;
    }
    .header-title h2 {
      color: #3b2a5f;
      font-size: 17px;
      margin-bottom: 3px;
    }
    .header-title p {
      font-size: 12px;
      color: #7a6aa5;
    }

    /* 高级设置折叠面板 */
    .discount-wrap {
      margin-bottom: 12px;
    }
    .discount-wrap details {
      border: 1px solid #d9cdf0;
      border-radius: 8px;
      background: #fbf9ff;
    }
    .discount-wrap summary {
      padding: 9px 12px;
      cursor: pointer;
      list-style: none;
      display: flex;
      align-items: center;
      font-size: 13px;
      font-weight: 500;
      color: #4b3a7a;
    }
    .discount-wrap summary::marker {
      display: none;
    }
    .discount-wrap summary::after {
      content: "▼";
      margin-left: auto;
      font-size: 11px;
      color: #7c3aed;
      transition: transform 0.25s;
    }
    .discount-wrap details[open] summary::after {
      transform: rotate(180deg);
    }
    .discount-inner {
      padding: 10px 12px 12px;
      border-top: 1px solid #e3d9f5;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .discount-inner label {
      font-size: 13px;
      color: #4b3a7a;
    }
    .discount-inner select {
      padding: 6px 10px;
      border: 1px solid #cbb7ec;
      border-radius: 6px;
      font-size: 13px;
      background: #fff;
      color: #3b2a5f;
    }

    /* 表格区域 */
    .table-wrap {
      overflow-x: auto;
      border: 1px solid #d9cdf0;
      border-radius: 8px;
      background: #fff;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 740px;
    }
    /* 逐列设置窄宽度，刚好放下内容 */
    colgroup col:nth-child(1) { width: 110px; } /*产品类型*/
    colgroup col:nth-child(2) { width: 80px; }  /*型号*/
    colgroup col:nth-child(3) { width: 75px; }  /*材质*/
    colgroup col:nth-child(4) { width: 85px; }  /*单双作用*/
    colgroup col:nth-child(5) { width: 75px; }  /*弹簧数量*/
    colgroup col:nth-child(6) { width: 60px; }  /*数量（仅3位数字）*/
    colgroup col:nth-child(7) { width: 85px; }  /*单价*/
    colgroup col:nth-child(8) { width: 85px; }  /*小计*/
    colgroup col:nth-child(9) { width: 70px; }  /*操作*/

    table th {
      background: #ede7ff;
      padding: 7px 4px;
      border: 1px solid #d9cdf0;
      text-align: center;
      font-size: 12px;
      color: #3b2a5f;
      font-weight: 600;
      word-break: normal;
    }
    table td {
      border: 1px solid #e3d9f5;
      padding: 5px 3px;
      text-align: center;
      vertical-align: middle;
    }
    table td select,
    table td input[type="number"] {
      width: 100%;
      border: 1px solid #cbb7ec;
      border-radius: 4px;
      padding: 5px 3px;
      font-size: 12px;
      background: #fff;
      color: #3b2a5f;
    }
    table td select:disabled {
      background: #efecf7;
      color: #8877aa;
    }
    table td input[type="number"]:focus,
    table td select:focus {
      outline: none;
      border-color: #7c3aed;
      background: #fbf9ff;
    }
    .readonly-cell {
      background: #faf6ff;
      color: #5b21b6;
      font-weight: 600;
      font-size: 12px;
    }
    .btn-del-row {
      padding: 4px 6px;
      background: #a78bfa;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-del-row:hover {
      background: #8b5cf6;
    }

    /* 按钮行 */
    .btn-bar {
      margin-top: 12px;
    }
    #btnAddRow {
      padding: 7px 14px;
      background: linear-gradient(135deg, #7c3aed, #a78bfa);
      color: #fff;
      border: none;
      border-radius: 7px;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(124, 58, 237, 0.25);
    }
    #btnAddRow:hover {
      background: linear-gradient(135deg, #6d28d9, #8b5cf6);
    }

    /* 合计行 */
    .total-row td {
      background: #ede7ff;
      font-weight: 700;
      font-size: 13px;
      color: #3b2a5f;
    }
  </style>
</head>
<body>
<div class="container">
  <div class="header-title">
    <h2>科振不锈钢执行器报价</h2>
    <p>含13%增值税</p>
  </div>

  <!-- 高级设置-折扣 默认折叠隐藏 -->
  <div class="discount-wrap">
    <details>
      <summary>高级设置</summary>
      <div class="discount-inner">
        <label>折扣：</label>
        <select id="discountSelect">
          <option value="1.00" selected>原价（不打折）</option>
          <option value="0.99">99折</option>
          <option value="0.98">98折</option>
          <option value="0.97">97折</option>
          <option value="0.96">96折</option>
          <option value="0.95">95折</option>
          <option value="0.94">94折</option>
          <option value="0.93">93折</option>
          <option value="0.92">92折</option>
          <option value="0.91">91折</option>
          <option value="0.90">90折</option>
          <option value="0.89">89折</option>
          <option value="0.88">88折</option>
          <option value="0.87">87折</option>
          <option value="0.86">86折</option>
          <option value="0.85">85折</option>
        </select>
      </div>
    </details>
  </div>

  <div class="table-wrap">
    <table id="quoteTable">
      <colgroup>
        <col>
        <col>
        <col>
        <col>
        <col>
        <col>
        <col>
        <col>
        <col>
      </colgroup>
      <thead>
        <tr>
          <th>产品类型</th>
          <th>型号</th>
          <th>材质</th>
          <th>单双作用</th>
          <th>弹簧数量</th>
          <th>数量</th>
          <th>单价</th>
          <th>小计</th>
          <th>操作</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- js动态生成行 -->
      </tbody>
      <tfoot>
        <tr class="total-row">
          <td colspan="7" style="text-align:right;padding-right:6px">合计总价：</td>
          <td id="totalAll">0 元</td>
          <td></td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div class="btn-bar">
    <button id="btnAddRow">➕ 添加一行</button>
  </div>
</div>

<script>
  // 产品基础数据库（恢复气动+液压）
  const productData = {
    pneumatic: {
      bodyPrice: {
        ss304: {"KZ-45":589,"KZ-52":669,"KZ-63":815,"KZ-75":1023,"KZ-83":1076,"KZ-92":1480,"KZ-105":1659,"KZ-125":2475,"KZ-140":3834,"KZ-160":4802,"KZ-190":10780,"KZ-210":12502,"KZ-240":25850,"KZ-270":36938,"KZ-300":42350,"KZ-350":67500,"KZ-400":85800},
        ss316: {"KZ-45":622,"KZ-52":699,"KZ-63":876,"KZ-75":1084,"KZ-83":1150,"KZ-92":1518,"KZ-105":1791,"KZ-125":2662,"KZ-140":3991,"KZ-160":5187,"KZ-190":11880,"KZ-210":13057,"KZ-240":28050,"KZ-270":40150,"KZ-300":45980,"KZ-350":71600,"KZ-400":92950}
      },
      springUnitPrice: {
        "KZ-45":2.5,"KZ-52":3,"KZ-63":4,"KZ-75":5.5,"KZ-83":6,"KZ-92":8,"KZ-105":11,
        "KZ-125":15,"KZ-140":23,"KZ-160":38,"KZ-190":55,"KZ-210":65,"KZ-240":80,
        "KZ-270":95,"KZ-300":110,"KZ-350":135,"KZ-400":160
      },
      springMaxCount: {
        "KZ-45":4,"KZ-52":12,"KZ-63":12,"KZ-75":12,"KZ-83":12,"KZ-92":12,"KZ-105":12,
        "KZ-125":12,"KZ-140":12,"KZ-160":12,"KZ-190":12,"KZ-210":12,"KZ-240":12,
        "KZ-270":12,"KZ-300":12,"KZ-350":12,"KZ-400":16
      }
    },
    hydraulic:{
      bodyPrice:{
        ss304:{"HD120":2970,"HD350":3260,"HD700":4080,"HD1400":5480,"HD3000":6990,"HD5000":7770,"HD10K":14660},
        ss316:{"HD120":3080,"HD350":3430,"HD700":4330,"HD1400":5940,"HD3000":7640,"HD5000":9020,"HD10K":16040}
      },
      springUnitPrice:{},
      springMaxCount:{}
    }
  };

  // DOM
  const tableBody = document.getElementById("tableBody");
  const btnAddRow = document.getElementById("btnAddRow");
  const discountSelect = document.getElementById("discountSelect");
  const totalAllEl = document.getElementById("totalAll");

  // 根据产品类型获取型号列表
  function getModelList(category){
    return Object.keys(productData[category].bodyPrice.ss304);
  }

  // 生成弹簧下拉选项html
  function getSpringOptionsHtml(category,model){
    if(category==="hydraulic") return `<option value="0">0</option>`;
    const max = productData.pneumatic.springMaxCount[model] ||12;
    let html = `<option value="0">0</option>`;
    for(let i=1;i<=max;i++){
      html += `<option value="${i}">${i}</option>`;
    }
    return html;
  }

  // 更新该行弹簧、作用类型控件状态
  function updateRowState(row){
    const cat = row.querySelector(".sel-category").value;
    const actType = row.querySelector(".sel-type").value;
    const selSpring = row.querySelector(".sel-spring");
    const selType = row.querySelector(".sel-type");

    if(cat === "hydraulic"){
      // 液压：弹簧固定0禁用；作用类型禁用
      selSpring.value="0";
      selSpring.disabled=true;
      selType.disabled=true;
      selType.value="double";
    }else{
      selType.disabled=false;
      if(actType === "double"){
        selSpring.value = "0";
        selSpring.disabled = true;
      }else{
        selSpring.disabled = false;
        if(selSpring.value === "0"){
          selSpring.value = "1";
        }
      }
    }
  }

  // 计算单行【未打折单价】
  function calcRowOriginPrice(category,model,material,actType,springCount){
    let base;
    if(material==="ss316l"){
      base = Math.round(productData[category].bodyPrice.ss316[model] *1.05);
    }else{
      base = productData[category].bodyPrice[material][model]||0;
    }
    let price = base;
    // 只有气动+单作用才加弹簧费用
    if(category==="pneumatic" && actType==="single"){
      const sp = productData.pneumatic.springUnitPrice[model]||0;
      price += Math.round(springCount * sp);
    }
    return price;
  }

  // 更新整张表格全部行+合计
  function recalcAll(){
    const discount = parseFloat(discountSelect.value);
    let grandTotal =0;
    const rows = tableBody.querySelectorAll(".quote-row");
    rows.forEach(row=>{
      updateRowState(row);
      const category = row.querySelector(".sel-category").value;
      const model = row.querySelector(".sel-model").value;
      const material = row.querySelector(".sel-material").value;
      const actType = row.querySelector(".sel-type").value;
      const springCount = parseInt(row.querySelector(".sel-spring").value);
      const qty = parseInt(row.querySelector(".input-qty").value) || 1;

      const originPrice = calcRowOriginPrice(category,model,material,actType,springCount);
      const unitPrice = Math.round(originPrice * discount);
      const subtotal = unitPrice * qty;

      row.querySelector(".cell-unit").innerText = unitPrice + " 元";
      row.querySelector(".cell-sub").innerText = subtotal + " 元";
      grandTotal += subtotal;
    });
    totalAllEl.innerText = grandTotal + " 元";
  }

  // 添加一行
  function addRow(){
    const tr = document.createElement("tr");
    tr.className = "quote-row";
    const defaultCat = "pneumatic";
    const defaultModel = getModelList(defaultCat)[0];

    tr.innerHTML = `
    <td>
      <select class="sel-category">
        <option value="pneumatic">气动执行器</option>
        <option value="hydraulic">液压执行器</option>
      </select>
    </td>
    <td>
      <select class="sel-model">
        ${getModelList(defaultCat).map(m=>`<option value="${m}" ${m===defaultModel?"selected":""}>${m}</option>`).join("")}
      </select>
    </td>
    <td>
      <select class="sel-material">
        <option value="ss304">SS304</option>
        <option value="ss316">SS316</option>
        <option value="ss316l">316L</option>
      </select>
    </td>
    <td>
      <select class="sel-type">
        <option value="double">双作用</option>
        <option value="single">单作用</option>
      </select>
    </td>
    <td>
      <select class="sel-spring">
        ${getSpringOptionsHtml(defaultCat,defaultModel)}
      </select>
    </td>
    <td>
      <input class="input-qty" type="number" min="1" value="1">
    </td>
    <td class="readonly-cell cell-unit">0 元</td>
    <td class="readonly-cell cell-sub">0 元</td>
    <td>
      <button class="btn-del-row">删除</button>
    </td>
    `;
    tableBody.appendChild(tr);

    const selCat = tr.querySelector(".sel-category");
    const selModel = tr.querySelector(".sel-model");
    const selSpring = tr.querySelector(".sel-spring");
    const selType = tr.querySelector(".sel-type");

    // 切换产品类型：刷新型号下拉
    selCat.addEventListener("change",()=>{
      const cat = selCat.value;
      const mdList = getModelList(cat);
      selModel.innerHTML = mdList.map(m=>`<option value="${m}">${m}</option>`).join("");
      selModel.value = mdList[0];
      selSpring.innerHTML = getSpringOptionsHtml(cat,selModel.value);
      recalcAll();
    });

    // 切换型号：刷新弹簧下拉
    selModel.addEventListener("change",()=>{
      const cat = selCat.value;
      selSpring.innerHTML = getSpringOptionsHtml(cat,selModel.value);
      recalcAll();
    });

    selType.addEventListener("change",()=>{
      recalcAll();
    });

    // 删除行
    tr.querySelector(".btn-del-row").addEventListener("click",()=>{
      tr.remove();
      recalcAll();
    });

    // 该行内所有输入变化触发重算
    tr.querySelectorAll("select,input").forEach(el=>{
      el.addEventListener("change",recalcAll);
      el.addEventListener("input",recalcAll);
    });
    recalcAll();
  }

  // 事件绑定
  btnAddRow.addEventListener("click",addRow);
  discountSelect.addEventListener("change",recalcAll);

  // 页面初始化：默认2行
  window.onload = function(){
    addRow();
    addRow();
    recalcAll();
  };
</script>
</body>
</html>
